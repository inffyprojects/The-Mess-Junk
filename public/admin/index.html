<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>The Mess Junk — Content Manager</title>
  <script>window.CMS_MANUAL_INIT = true;</script>
  <script src="https://unpkg.com/decap-cms@3.3.3/dist/decap-cms.js"></script>
  <script>
    // base_url must be an absolute origin for the OAuth redirect to work.
    // Setting it here instead of in config.yml avoids hardcoding a domain,
    // so the CMS works on any host (Vercel, Cloudflare, preview deploys).
    window.CMS.init({
      config: {
        load_config_file: true,
        backend: {
          base_url: window.location.origin
        }
      }
    });
  </script>
</head>
<body>
</body>
</html>
