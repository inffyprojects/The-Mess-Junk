# Decap CMS configuration — The Mess Junk
#
# Every field here mirrors src/content.config.ts exactly. If you change a
# schema there, update the matching widget here or the CMS will produce
# entries that fail the Astro build.

backend:
  name: github
  repo: inffyprojects/The-Mess-Junk
  branch: main
  auth_endpoint: api/auth

# Media: upload to src/assets/photos so Astro's image pipeline (Sharp,
# AVIF/WebP, srcset) processes them at build time. This preserves the
# mobile performance budget from the design document.
media_folder: src/assets/photos
public_folder: /src/assets/photos

# Disable the default preview pane. The site's design uses custom tokens,
# motifs and components that cannot be replicated in a generic iframe
# preview — showing raw unstyled Markdown would misrepresent the design.
# Editors see the live site after each save (rebuild takes about a minute).
editor:
  preview: false

# Slug sanitisation: keep filenames URL-safe and consistent with existing
# content.
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'

collections:
  # ------------------------------------------------------------------
  # 1. Workshops — one Markdown file per workshop
  # ------------------------------------------------------------------
  - name: workshops
    label: Workshops
    label_singular: Workshop
    folder: src/content/workshops
    create: true
    delete: true
    slug: '{{slug}}'
    preview_path: workshops
    extension: md
    format: frontmatter
    sortable_fields: ['order', 'title', 'priceFrom']
    summary: '{{title}} — From Rs.{{priceFrom}} ({{categories}})'
    fields:
      - name: title
        label: Workshop title
        widget: string
        hint: >-
          The name shown on the card and at the top of the workshop page.
          Keep it short and distinctive.

      - name: summary
        label: Summary
        widget: string
        hint: >-
          One line shown on the workshop card, about 90 characters. Describe
          what the participant will do, not what you offer.

      - name: categories
        label: Categories
        widget: select
        multiple: true
        min: 1
        options:
          - { label: 'Kids', value: 'kids' }
          - { label: 'Teens', value: 'teens' }
          - { label: 'Adults', value: 'adults' }
          - { label: 'Corporate & Colleges', value: 'corporate-colleges' }
          - { label: 'Private / Custom', value: 'private-custom' }
          - { label: 'Seasonal', value: 'seasonal' }
        hint: >-
          Which filter tabs should show this workshop. Pick at least one.
          Most workshops belong to two or three.

      - name: priceFrom
        label: Starting price (Rs.)
        widget: number
        value_type: int
        min: 1
        hint: >-
          The lowest per-person price in rupees, digits only. Shown as
          "From Rs.1,200" on the card. Do not include the rupee symbol.

      - name: ageGroup
        label: Age group
        widget: string
        default: 'All ages'
        hint: >-
          Shown as a small label on the card. Examples: "8+ yrs",
          "14+ yrs", "All ages".

      - name: duration
        label: Duration
        widget: string
        default: '2 hours'
        hint: >-
          How long the session runs. Examples: "2 hours", "1.5 hours",
          "3 hours".

      - name: minParticipants
        label: Minimum participants
        widget: number
        value_type: int
        min: 1
        required: false
        hint: >-
          Only fill this in for private or group-only formats. Leave it
          empty for public workshops that accept individual bookings.

      - name: shot
        label: Image slot ID
        widget: string
        hint: >-
          The image slot this workshop uses for its card. Must match an
          id from the shot list (e.g. ws-pottery, ws-canvas). Ask the
          developer if you are not sure which to use.

      - name: takeaway
        label: Takeaway
        widget: string
        required: false
        hint: >-
          What the participant takes home, if anything. Examples:
          "Your finished pot, glazed and fired", "A printed tote bag".
          Leave empty if nothing physical goes home.

      - name: order
        label: Sort order
        widget: number
        value_type: int
        default: 50
        hint: >-
          Lower numbers appear first on the Workshops page. Set 10 for
          the most popular workshops, 50 for most, 90 for niche ones.

      - name: draft
        label: Hidden (draft)
        widget: boolean
        default: false
        hint: >-
          Turn this on to hide the workshop from the site without
          deleting it. Useful for seasonal workshops that are not
          running right now.

      - name: body
        label: Description
        widget: markdown
        hint: >-
          Two or three short paragraphs about the workshop. What happens
          in the session, what materials are used, what the experience is
          like. Keep it conversational.

  # ------------------------------------------------------------------
  # 2. FAQ — one Markdown file per question
  # ------------------------------------------------------------------
  - name: faq
    label: FAQ
    label_singular: Question
    folder: src/content/faq
    create: true
    delete: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    sortable_fields: ['order', 'question', 'group']
    summary: '{{question}} ({{group}})'
    fields:
      - name: question
        label: Question
        widget: string
        hint: >-
          The question as a visitor would ask it. Start with "How",
          "What", "Can I", etc. Keep it to one sentence.

      - name: group
        label: Section
        widget: select
        options:
          - { label: 'Booking & availability', value: 'booking' }
          - { label: 'Pricing & group size', value: 'pricing' }
          - { label: 'What to expect', value: 'expect' }
        hint: >-
          Which section of the FAQ page this question appears in.

      - name: order
        label: Sort order
        widget: number
        value_type: int
        default: 50
        hint: >-
          Lower numbers appear first within their section.

      - name: body
        label: Answer
        widget: markdown
        hint: >-
          The answer. Keep it to two or three sentences. Write as if
          you are replying to the visitor on WhatsApp — short, clear,
          no jargon.

  # ------------------------------------------------------------------
  # 3. Pricing tiers — single JSON file with an array of objects
  # ------------------------------------------------------------------
  - name: pricing
    label: Pricing Tiers
    description: The three pricing cards on the Pricing page.
    files:
      - name: tiers
        label: Pricing tiers
        file: src/content/pricing/tiers.json
        fields:
          - name: tiers
            label: Tiers
            label_singular: Tier
            widget: list
            min: 1
            fields:
              - name: id
                label: ID
                widget: string
                hint: >-
                  A short unique identifier, like "public" or "private".
                  Used internally — visitors never see this.

              - name: name
                label: Tier name
                widget: string
                hint: >-
                  The heading on the pricing card. Examples: "Public
                  Workshops", "Private & Group Workshops".

              - name: price
                label: Price text
                widget: string
                hint: >-
                  Shown as the large price on the card. Free text, so it
                  can say "Rs.499 - Rs.2,500" or "Custom" or "Let's talk".

              - name: priceNote
                label: Price note
                widget: string
                required: false
                hint: >-
                  A short line under the price, like "per person, depending
                  on the craft". Leave empty if the price speaks for itself.

              - name: summary
                label: Summary
                widget: text
                hint: >-
                  One or two sentences describing this tier. Shown below
                  the price.

              - name: includes
                label: What is included
                widget: list
                field:
                  name: item
                  label: Item
                  widget: string
                min: 1
                hint: >-
                  The bulleted list of what this tier includes. Add at
                  least one item.

              - name: enquiryType
                label: Enquiry type
                widget: string
                hint: >-
                  Pre-fills the "Event type" field on the enquiry form when
                  someone clicks the CTA on this tier.

              - name: featured
                label: Featured
                widget: boolean
                default: false
                hint: >-
                  Turn on for exactly one tier to make it visually stand
                  out. Usually the most popular option.

              - name: order
                label: Sort order
                widget: number
                value_type: int
                default: 50
                hint: >-
                  Lower numbers appear first on the page.

  # ------------------------------------------------------------------
  # 4. Upcoming dates — single JSON file with an array of objects
  # ------------------------------------------------------------------
  - name: dates
    label: Upcoming Dates
    description: The workshop schedule shown on the Contact page.
    files:
      - name: upcoming
        label: Upcoming dates
        file: src/content/dates/upcoming.json
        fields:
          - name: dates
            label: Dates
            label_singular: Date
            widget: list
            min: 0
            fields:
              - name: id
                label: ID
                widget: string
                hint: >-
                  A unique identifier. Use the format "2026-08-08-pottery"
                  (date and workshop name). Visitors never see this.

              - name: date
                label: Date
                widget: datetime
                format: 'YYYY-MM-DD'
                date_format: 'YYYY-MM-DD'
                time_format: false
                hint: >-
                  The session date. Pick it from the calendar.

              - name: time
                label: Time
                widget: string
                hint: >-
                  The session time as text, e.g. "11:00 AM - 1:30 PM".

              - name: workshop
                label: Workshop name
                widget: string
                hint: >-
                  The name of the workshop running on this date. Should
                  match a workshop title exactly so the enquiry form
                  pre-fills correctly.

              - name: seatsTotal
                label: Total seats
                widget: number
                value_type: int
                min: 1
                hint: >-
                  How many seats the session has in total.

              - name: seatsLeft
                label: Seats left
                widget: number
                value_type: int
                min: 0
                hint: >-
                  How many seats are still available. Set to 0 to show
                  the session as "Full". Update this whenever a booking
                  comes in.

              - name: priceFrom
                label: Starting price (Rs.)
                widget: number
                value_type: int
                min: 1
                required: false
                hint: >-
                  The per-person price for this session, if different from
                  the workshop's default. Leave empty to use the workshop's
                  own price.
